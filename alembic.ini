# Alembic configuration file for Aegis Analytics AI
# Used by: alembic upgrade head / alembic revision --autogenerate

[alembic]
# Path to migration scripts
script_location = backend/app/db/migrations

# Template for new migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Truncate long migration slugs
truncate_slug_length = 40

# Timezone for migration timestamps
timezone = UTC

# SQLAlchemy database URL — reads from DATABASE_URL env var at runtime
# Override here for a static URL during development:
# sqlalchemy.url = postgresql+psycopg2://aegis_user:aegis_password@localhost:5432/aegis
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
